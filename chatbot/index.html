<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenix AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg-page: transparent;
      --bg-shell: #101726;
      --bg-header: #0d1320;
      --bg-bot: #182236;
      --bg-user: #2563eb;
      --bg-input: #151e30;
      --border-subtle: rgba(148, 163, 184, 0.14);
      --border-focus: #3b82f6;
      --text-main: #e8eef8;
      --text-muted: #94a3b8;
      --font-ui: "Inter", "Noto Sans Sinhala", "Noto Sans Tamil", "Nirmala UI", "Iskoola Pota", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-ui);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: var(--font-ui);
      background: transparent !important;
      background-color: transparent !important;
      color: var(--text-main);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .chat-shell {
      display: none !important;
    }

    .chat-header {
      padding: 14px 18px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .chat-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.65);
    }

    .chat-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.01em;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #themeToggleBtn {
      background: rgba(148, 163, 184, 0.08);
      color: #f8fafc;
      border: 1px solid var(--border-subtle);
      border-radius: 9px;
      width: 32px;
      height: 32px;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }

    #themeToggleBtn:hover {
      background: rgba(148, 163, 184, 0.18);
      border-color: rgba(96, 165, 250, 0.45);
    }

    #themeToggleBtn:active {
      transform: scale(0.95);
    }

    #clearBtn {
      background: rgba(148, 163, 184, 0.08);
      color: #cbd5e1;
      border: 1px solid var(--border-subtle);
      border-radius: 9px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    #clearBtn:hover {
      background: rgba(148, 163, 184, 0.18);
      color: #ffffff;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      scroll-behavior: auto;
    }

    #messages::-webkit-scrollbar {
      width: 6px;
    }

    #messages::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.22);
      border-radius: 999px;
    }

    .msg {
      max-width: 83%;
      padding: 11px 14px;
      border-radius: 15px;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: var(--font-ui);
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--bg-bot);
      color: var(--text-main);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.28);
    }

    #paymentCards {
      display: none;
    }

    #attachedPreview {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 14px;
      background: #131c2e;
      border-top: 1px solid var(--border-subtle);
      font-size: 12.5px;
      color: #93c5fd;
    }

    .attached-file-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #removeFileBtn {
      background: transparent;
      border: none;
      color: #f87171;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
    }

    #removeFileBtn:hover {
      background: rgba(248, 113, 113, 0.14);
    }

    #chatForm {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      background: var(--bg-header);
      border-top: 1px solid var(--border-subtle);
    }

    #attachBtn {
      background: var(--bg-input);
      color: #cbd5e1;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    #attachBtn:hover {
      background: #1e2b45;
      color: #ffffff;
      border-color: rgba(96, 165, 250, 0.45);
    }

    #attachBtn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #userInput {
      flex: 1;
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-input);
      color: var(--text-main);
      padding: 0 13px;
      font-size: 13.8px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    #userInput::placeholder {
      color: var(--text-muted);
    }

    #userInput:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.16);
    }

    #sendBtn {
      height: 40px;
      padding: 0 16px;
      border-radius: 12px;
      border: none;
      background: #2563eb;
      color: #ffffff;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s ease;
    }

    #sendBtn:hover:not(:disabled) {
      background: #1d4ed8;
    }

    #sendBtn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* ================= Light Mode Styles ================= */
    body.light-theme {
      background: transparent !important;
      background-color: transparent !important;
      color: #0f172a;
    }

    body.light-theme .chat-shell {
      background: #ffffff;
      border-color: rgba(15, 23, 42, 0.12);
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.14);
    }

    body.light-theme .chat-header {
      background: #f8fafc;
      border-bottom-color: rgba(15, 23, 42, 0.1);
    }

    body.light-theme .chat-title {
      color: #0f172a;
    }

    body.light-theme #themeToggleBtn,
    body.light-theme #clearBtn {
      background: #ffffff;
      color: #0f172a;
      border-color: rgba(15, 23, 42, 0.14);
    }

    body.light-theme #themeToggleBtn:hover,
    body.light-theme #clearBtn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    body.light-theme #messages {
      background: #ffffff;
    }

    body.light-theme .msg.bot {
      background: #f1f5f9;
      color: #0f172a;
      border-color: rgba(15, 23, 42, 0.08);
    }

    body.light-theme #attachedPreview {
      background: #f8fafc;
      border-top-color: rgba(15, 23, 42, 0.1);
      color: #1d4ed8;
    }

    body.light-theme #chatForm {
      background: #f8fafc;
      border-top-color: rgba(15, 23, 42, 0.1);
    }

    body.light-theme #attachBtn {
      background: #ffffff;
      color: #334155;
      border-color: rgba(15, 23, 42, 0.14);
    }

    body.light-theme #attachBtn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    body.light-theme #userInput {
      background: #ffffff;
      color: #0f172a;
      border-color: rgba(15, 23, 42, 0.16);
    }

    body.light-theme #userInput::placeholder {
      color: #64748b;
    }

    body.light-theme .active-payment-card-box .pay-card {
      background: #f8fafc !important;
      border-color: rgba(37, 99, 235, 0.35) !important;
      color: #0f172a !important;
    }

    body.light-theme .active-payment-card-box .pay-card:hover {
      background: #eff6ff !important;
      border-color: #2563eb !important;
    }

    body.light-theme .active-payment-card-box .pay-title {
      color: #1d4ed8 !important;
    }

    body.light-theme .active-payment-card-box .pay-sub {
      color: #334155 !important;
    }
  </style>
</head>
<body>
  <div class="chat-shell">
    <div class="chat-header">
      <div class="chat-title-wrap">
        <span class="status-dot"></span>
        <div class="chat-title">Store Assistant</div>
      </div>
      <div class="header-controls">
        <button id="themeToggleBtn" type="button" title="Switch Theme" aria-label="Switch Theme">☀️</button>
        <button id="clearBtn" type="button">Clear</button>
      </div>
    </div>

    <div id="messages"></div>
    <div id="paymentCards"></div>

    <div id="attachedPreview">
      <span id="attachedName" class="attached-file-label"></span>
      <button id="removeFileBtn" type="button" title="Remove file">✕</button>
    </div>

    <form id="chatForm">
      <input id="fileInput" type="file" accept=".png,.jpg,.jpeg,.pdf,image/png,image/jpeg,application/pdf" style="display:none;" />
      <button id="attachBtn" type="button" title="Attach PNG, JPG, or PDF" aria-label="Attach PNG, JPG, or PDF">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
        </svg>
      </button>
      <input id="userInput" type="text" placeholder="Type a message..." autocomplete="off" />
      <button id="sendBtn" type="submit">Send</button>
    </form>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
